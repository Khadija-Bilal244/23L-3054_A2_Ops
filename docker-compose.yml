# Web app + PostgreSQL.  One command:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume -> history survives `down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # NO "ports:" -> reachable only from other services on the Compose network (as host "db")

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy            # web starts only when Postgres accepts connections
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "5000:5000"
    volumes:
      # Model is MOUNTED, not built in: image stays small & identical for every model,
      # swapping the champion = replace a file + restart, no rebuild/push.
      - ./models:/models:ro

volumes:
  pgdata:
